<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Media - Admin Intelligence</title>
    <link rel="stylesheet" href="mobile-fix.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --bg: #010409;
            --card-bg: rgba(13, 17, 23, 0.7);
            --border: rgba(48, 54, 61, 0.8);
        }

        body {
            background: var(--bg);
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #c9d1d9;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            grid-template-rows: auto 1fr;
            gap: 16px;
            max-width: 1800px;
            margin: 0 auto;
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-bottom: 2px solid var(--accent);
            border-radius: 4px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .logo-section { display: flex; align-items: center; gap: 12px; }
        .logo-section img { height: 28px; filter: brightness(0) invert(1) drop-shadow(0 0 5px var(--accent)); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        .card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent); opacity: 0; transition: 0.3s;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: inset 0 0 15px var(--accent-glow);
        }

        .card:hover::after { opacity: 1; }

        .sidebar-title {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 16px;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .stat-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .stat-info { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.75rem; color: #8b949e; margin-bottom: 4px; }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: #fff; font-family: monospace; }

        .health-grid { display: grid; gap: 8px; }
        .health-tag {
            display: flex; justify-content: space-between; padding: 8px 12px;
            font-size: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            border-radius: 4px;
        }

        .main-content { border-top: 2px solid var(--accent); }
        .chart-container { height: 500px; padding: 10px; }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px 8px; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
        
        .pulse {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent);
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.3; } }

        .loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; flex-direction: column; gap: 20px;
            justify-content: center; align-items: center; z-index: 1000;
        }

        @media (max-width: 1400px) {
            .dashboard { grid-template-columns: 1fr; }
            header { grid-column: auto; }
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <img src="logo.svg" style="width: 80px; filter: invert(1) drop-shadow(0 0 10px var(--accent));">
        <div style="font-size: 0.8rem; letter-spacing: 4px; color: var(--accent);">INITIALIZING COMMAND CENTER...</div>
    </div>

    <div class="dashboard">
        <header>
            <div class="logo-section">
                <img src="logo.svg" alt="Logo">
                <div style="width: 1px; height: 20px; background: var(--border);"></div>
                <span style="font-weight: 800; font-size: 0.8rem; letter-spacing: 2px;">COMMAND CENTER <span style="color:var(--accent);">v3.0</span></span>
            </div>
            <div id="clock" style="font-family: monospace; color: var(--accent); font-size: 0.9rem;"></div>
        </header>

        <div class="sidebar-left">
            <div class="card">
                <div class="sidebar-title">Real-time Metrics</div>
                <div class="stat-box">
                    <div class="stat-info"><span class="stat-label">Active Tickets</span><span class="stat-value" id="ticketCount">0</span></div>
                    <div style="color: var(--accent);">[SYS]</div>
                </div>
                <div class="stat-box">
                    <div class="stat-info"><span class="stat-label">Offline Units</span><span class="stat-value" id="offlineCount" style="color:#ff4444;">0</span></div>
                    <div style="color: #ff4444;">[WARN]</div>
                </div>
                <div class="stat-box">
                    <div class="stat-info"><span class="stat-label">Network Flows</span><span class="stat-value" id="flowCount">0</span></div>
                    <div style="color: var(--accent);">[NET]</div>
                </div>
            </div>

            <div class="card" style="margin-top: 16px;">
                <div class="sidebar-title">System Integrity</div>
                <div class="health-grid">
                    <div class="health-tag"><span>DB Retention</span><span style="color:#00ff88;">ACTIVE</span></div>
                    <div class="health-tag"><span>Auto-Backup</span><span style="color:#00ff88;">READY</span></div>
                    <div class="health-tag"><span>Telegram Gateway</span><span style="color:#ffaa00;">STANDBY</span></div>
                </div>
            </div>
        </div>

        <div class="main-content card">
            <div class="sidebar-title">NetFlow Traffic Analysis</div>
            <div class="chart-container">
                <canvas id="flowChart"></canvas>
            </div>
        </div>

        <div class="sidebar-right card">
            <div class="sidebar-title">Threat Intelligence</div>
            <div style="overflow-y: auto; max-height: 500px;">
                <table id="ticketTable">
                    <tbody id="ticketList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = `http://${window.location.hostname}:3001/api/admin`;

        async function fetchData() {
            try {
                const [stats, tickets] = await Promise.all([
                    fetch(`${API_BASE}/stats`).then(r => r.json()),
                    fetch(`${API_BASE}/tickets`).then(r => r.json())
                ]);

                document.getElementById('ticketCount').innerText = stats.openTickets.toString().padStart(2, '0');
                document.getElementById('offlineCount').innerText = stats.offlineDevices.toString().padStart(2, '0');
                document.getElementById('flowCount').innerText = stats.flows.length.toString().padStart(2, '0');

                updateChart(stats.flows);
                updateTicketList(tickets);

                setTimeout(() => {
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
                }, 1000);
            } catch (e) {
                console.error("Link error", e);
            }
        }

        let flowChart;
        function updateChart(flows) {
            const ctx = document.getElementById('flowChart').getContext('2d');
            const data = {
                labels: flows.map(f => f.src_ip.split('.').slice(-2).join('.')),
                datasets: [{
                    data: flows.map(f => f.total_bytes),
                    backgroundColor: 'rgba(0, 242, 255, 0.1)',
                    borderColor: '#00f2ff',
                    borderWidth: 2,
                    pointBackgroundColor: '#00f2ff',
                    tension: 0.4,
                    fill: true
                }]
            };

            if (flowChart) flowChart.destroy();
            flowChart = new Chart(ctx, {
                type: 'line', // Changed to line for command center feel
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { 
                            grid: { color: 'rgba(0, 242, 255, 0.05)' },
                            ticks: { color: '#8b949e', font: { size: 10, family: 'monospace' } }
                        },
                        x: { 
                            grid: { color: 'rgba(0, 242, 255, 0.05)' },
                            ticks: { color: '#8b949e', font: { size: 10, family: 'monospace' } }
                        }
                    }
                }
            });
        }

        function updateTicketList(tickets) {
            const list = document.getElementById('ticketList');
            if (tickets.length === 0) {
                list.innerHTML = '<tr><td style="text-align:center; color:#444;">NO THREATS DETECTED</td></tr>';
                return;
            }
            list.innerHTML = tickets.map(t => `
                <tr>
                    <td title="${t.title}"><span class="pulse"></span>${t.title.substring(0, 25)}...</td>
                    <td style="color:${t.severity === 'error' ? '#ff4444' : '#ffaa00'}; font-weight:bold;">${t.severity[0].toUpperCase()}</td>
                </tr>
            `).join('');
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = `[ ${now.toLocaleTimeString()} ]`;
        }, 1000);

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
